[package]
name = "tekpair-desktop"
version = "0.1.2"
description = "TekPair — app de escritorio (con impresión nativa)"
authors = ["TekPair"]
edition = "2021"

# La lógica vive en lib.rs para poder compartirla; main.rs solo arranca.
[lib]
name = "tekpair_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
