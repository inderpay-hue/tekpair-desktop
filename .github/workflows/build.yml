name: build

# Compila el instalador de Windows en la nube (no hace falta tener Windows).
# Se dispara al hacer push a main, al crear un tag vX.Y.Z, o manualmente.
# (Mac queda deshabilitado: sin firma/notarización de Apple da avisos de "app dañada".)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

# Necesario para que la acción de Release pueda crear/publicar la Release en tags.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Generar iconos (desde app-icon.png)
        run: tauri icon app-icon.png

      - name: Build
        run: tauri build

      # Renombra el .exe a un nombre fijo para que el enlace de descarga directa
      # (releases/latest/download/TekPair-Setup.exe) no dependa de la versión.
      - name: Renombrar instalador a nombre estable
        shell: bash
        run: |
          mkdir -p dist-installer
          cp src-tauri/target/release/bundle/nsis/*-setup.exe "dist-installer/TekPair-Setup.exe"

      - name: Subir instalador (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tekpair-windows-installer
          path: dist-installer/TekPair-Setup.exe
          if-no-files-found: error

      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/TekPair-Setup.exe
