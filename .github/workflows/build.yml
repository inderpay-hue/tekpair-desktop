name: build

# Compila los instaladores de Windows y macOS en la nube (no hace falta tener
# ninguna de las dos máquinas). Se dispara al hacer push a main, al crear un tag
# vX.Y.Z, o manualmente.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tekpair-windows-installer
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact: tekpair-macos-installer
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Generar iconos (desde app-icon.png)
        run: tauri icon app-icon.png

      - name: Build
        run: tauri build

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

      # Si el push es un tag vX.Y.Z, además publica una Release con los instaladores.
      - name: Publicar Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
